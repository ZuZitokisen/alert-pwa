# Disposable branch only. Never merge this workflow replacement into main.
name: Hourly public schedule refresh
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Disposable branch: read-only probe regardless of mode.'
        type: choice
        options: [dry-run, publish]
        default: dry-run
permissions:
  contents: read
concurrency:
  group: tokisen-disposable-read-only-probe
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed read-only public Tokisen transport probe
        timeout-minutes: 2
        shell: bash
        run: |
          node --input-type=module <<'TOKISEN_PROBE'
          /** Fixed read-only public fetch probe. No credentials, arbitrary URLs or output bodies. */
          import {spawnSync} from 'node:child_process';
          import {mkdtempSync,readFileSync,rmSync} from 'node:fs';
          import {tmpdir} from 'node:os';import {join} from 'node:path';
          const URLS=['https://toki-sen.com/contents/schedule/page/2','https://toki-sen.com/contents/1122451?tag=all'];
          const UA='AlertPWA-PublicScheduleProbe/1.0 (https://github.com/ZuZitokisen/alert-pwa)',MAX=2000000;
          function describe(url,status,type,bytes){const html=bytes.toString('utf8');return {url,status,contentType:String(type).split(';')[0].slice(0,80),bytes:bytes.length,scheduleArchive:html.includes('class="contents-list list-unstyled"'),articleMetadata:html.includes('"@type":"NewsArticle"')};}
          async function native(url){try{const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(12000),headers:{Accept:'text/html','User-Agent':UA}});if(r.status>=300&&r.status<400||r.redirected){await r.body?.cancel();return {url,client:'node-fetch',status:r.status,error:'redirect_rejected'};}let n=0;const chunks=[];for await(const c of r.body){n+=c.length;if(n>MAX)throw Error('oversized');chunks.push(Buffer.from(c));}return {client:'node-fetch',...describe(url,r.status,r.headers.get('content-type'),Buffer.concat(chunks))};}catch(e){return {url,client:'node-fetch',error:e.name==='TimeoutError'?'timeout':'transport_failed'};}}
          function curl(url){const dir=mkdtempSync(join(tmpdir(),'tokisen-probe-'));try{const out=join(dir,'response');const r=spawnSync('curl',['--disable','--silent','--show-error','--proto','=https','--max-time','12','--connect-timeout','6','--max-filesize',String(MAX),'--max-redirs','0','--user-agent',UA,'--header','Accept: text/html','--output',out,'--write-out','%{http_code}\n%{content_type}',url],{encoding:'utf8',timeout:15000,maxBuffer:4096});if(r.status!==0)return {url,client:'curl',error:'transport_failed',exitCode:r.status};const [status,type]=r.stdout.split('\n');const bytes=readFileSync(out);return {client:'curl',...describe(url,Number(status),type,bytes),...(Number(status)>=300&&Number(status)<400?{error:'redirect_rejected'}:{})};}finally{rmSync(dir,{recursive:true,force:true});}}
          const report={mode:'fixed-public-read-only-probe',checkedAt:new Date().toISOString(),results:[]};
          for(const url of URLS){report.results.push(await native(url));report.results.push(curl(url));}
          console.log(JSON.stringify(report,null,2));
          // Diagnostics only: a failed network probe must not become a collector fallback.
          TOKISEN_PROBE
